<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="csssheet.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tryouts</title>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <img src="teamlogo.png" alt="Team Logo" class="team-logo">
            <h1 class="team-name">Lightning Stars FC</h1>
        </div>
        <nav class="nav-bar">
            <button type="button" onclick="location.href='fixture.html'">Fixture</button>
            <button type="button" onclick="location.href='roster.html'">Roster</button>
            <button type="button" onclick="location.href='aboutus.html'">About Us</button>
            <button type="button" onclick="location.href='homepage.html'">Homepage</button>
        </nav>
    </header>
    <main class="tryouts-content">
        <h2>Join Lightning Stars FC</h2>
        <div class="tryout-images">
            <img src="request2.jpg" alt="Tryout Image 1" class="tryout-image">
            <img src="a0c62bda-e75f-4358-a459-9bf3a09dbda7.jpg" alt="Tryout Image 2" class="tryout-image">
        </div>
        <div class="tryout-info">
            <p>Thank you for your interest in trying out with Lightning Stars FC.</p>
            <p>We are looking for players who are dedicated and willing to work hard.</p>
            <p>There is a <strong>$50 fee</strong> for trying out.</p>
            <p>Please fill out the form and send it to us. We will reach out to you.</p>
            <button type="button" class="tryout-button" onclick="location.href='https://www.surveymonkey.com/r/GVYJNVQ'">Submit Form</button>
        </div>
    </main>
</body>
</html>

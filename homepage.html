<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lightning Stars FC</title>
        <link rel="stylesheet" href="csssheet.css">
  
    </head>
    <body>
        <header class="main-header">
            <div class="header-content">
                <img src="teamlogo.png" alt="Team Logo" class="team-logo">
                <h1 class="team-name">Lightning Stars FC</h1>
            </div>
            <nav class="nav-bar">
                <button type="button" onclick="location.href='fixture.html'">Fixture</button>
                <button type="button" onclick="location.href='roster.html'">Roster</button>
                <button type="button" onclick="location.href='aboutus.html'">About Us</button>
                <button type="button" onclick="location.href='tryouts.html'">Join Us</button>
                <button type="button" onclick="location.href='sponsor.html'">sponsor</button>
            </nav>
        </header>
        <main>
            <section class="spotlight">
                <h2>Welcome to Lightning Stars FC!</h2>
                <video src="homepage.MP4" width="60%" autoplay loop muted></video>
                <div class="news">
                    <p>Stay tuned for the latest updates about Lightning Stars FC!</p>
                </div>
            </section>
            <section class="upcoming-matches">
                <h2>Upcoming Matches</h2>
                <div class="fixture-cards">
                    <div class="fixture-card">
                        <div class="team">
                            <img src="teamlogo.png" alt="Lightning Stars Logo" class="fixture-logo">
                            <p>Lightning Stars</p>
                        </div>
                        <div class="score">
                            <p>TBD</p>
                        </div>
                        <div class="opponent">
                            <img src="projectfootball.jpg" alt="Mighty Mainer Logo" class="fixture-logo">
                            <p>Project Football</p>
                        </div>
                        <div class="details">
                            <p><strong>Location:</strong> Captain John Bertram Athletic Field</p>
                            <p><strong>Date & Time:</strong> june 7, 5:30 pm </p>
                        </div>
                    </div>
                </div>
            </section>
           
        </main>
        <footer>
            <p>Contact Us:</p>
            <div class="social-icons">
                <a href="https://www.instagram.com/lightningstarsfc" target="_blank">
                    <img src="instagramlogo.jpg" alt="Instagram Logo" class="social-logo">
                </a>
                <a href="https://youtube.com/@lightningstarsfc" target="_blank">
                    <img src="youtube.jpg" alt="YouTube Logo" class="social-logo">
                </a>
                <a href="mailto:lightningstarsfc24@gmail.com" target="_blank">
                    <img src="gmail.darkmode.png" alt="Gmail Logo" class="social-logo">
                </a>
            </div>
        </footer>
    </body>
</html>
